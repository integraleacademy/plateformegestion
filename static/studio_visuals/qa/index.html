<!doctype html><html lang="fr"><meta charset="utf-8"><title>Studio — contrôle des compositions</title>
<link rel="stylesheet" href="../css/studio-shell.css"><link rel="stylesheet" href="../css/studio-canvas.css"><link rel="stylesheet" href="../css/studio-templates.css"><link rel="stylesheet" href="../css/studio-themes.css"><link rel="stylesheet" href="../css/studio-new-templates.css"><link rel="stylesheet" href="../css/studio-new2-templates.css"><link rel="stylesheet" href="../css/studio-new3-templates.css">
<style>body{padding:16px}.controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#edf1f7;padding:12px;z-index:100}.controls label{width:170px}.controls button{margin-bottom:12px}#preview{zoom:.6;margin:20px}#stage{position:absolute;left:-20000px;top:0}pre{white-space:pre-wrap;background:white;padding:18px}#summary{font-size:18px;font-weight:700}#examples{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}#examples>div{overflow:hidden;height:275px;background:white}#examples .social-studio-slide{transform:scale(.24);transform-origin:top left}</style>
<body class="social-studio"><div class="controls">
<label>Collection<select id="collection"><option value="new3">NEW3</option><option value="new2">NEW2</option><option value="all">Tous les modèles</option><option value="old">Modèles précédents</option></select></label>
<label>Formation<select id="formation"></select></label><label>Contenu<select id="scenario"><option value="default">Texte normal</option><option value="long">Texte long</option><option value="legacy">Ancien slogan répété</option></select></label>
<label>Étendue<select id="scope"><option value="one">Formation choisie</option><option value="all">Toutes les formations</option></select></label>
<button id="run">Contrôler</button><button id="stop" disabled>Arrêter</button>
<label>Modèle<select id="template"></select></label><label>Format<select id="format"></select></label><button id="view">Afficher</button>
<button id="png" disabled>Vérifier le PNG</button><button id="video" disabled>Vérifier la vidéo</button>
<label>Planche<select id="sheet"><option value="0">Modèles 1–10</option><option value="1">Modèles 11–20</option><option value="2">Modèles 21–30</option><option value="3">Modèles 31–40</option><option value="4">Modèles 41–50</option></select></label><button id="gallery">Voir les 10 modèles</button>
</div><p id="summary" aria-live="polite">Chargement…</p><div id="preview"></div><pre id="report"></pre><div id="stage"></div>
<div id="examples"></div>
<style>#examples{grid-template-columns:repeat(5,250px);gap:12px}#examples>div{height:282px;background:none;overflow:visible}#examples>div>strong{display:block;font-size:11px;padding:8px 0}#examples .qa-cell{height:250px;position:relative;overflow:hidden;background:none}#examples .social-studio-slide{position:absolute;inset:0;transform:scale(.23148);transform-origin:top left}</style>
<div id="studio-export-root" aria-hidden="true"></div>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js" defer></script>
<script type="module">
import {renderSlide} from '../js/studio-renderer.js';
import {fitSlide} from '../js/studio-text-fit.js';
import {validateStudioSlide} from '../js/studio-validation.js';
import {waitForImages,SocialVisualExporter} from '../js/studio-exporter.js';
import {createProject,defaultContentForFormation,FORMATS} from '../js/studio-store.js';
const $=id=>document.getElementById(id);
const [{templates},themes]=await Promise.all(['templates','themes'].map(n=>fetch('../data/'+n+'.json').then(r=>r.json())));
const ready=templates.filter(t=>t.status==='ready'||(t.isNew3&&t.status==='preview'));
const selectedTemplates=()=>ready.filter(t=>$('collection').value==='all'||($('collection').value==='new3'?t.isNew3:$('collection').value==='new2'?t.isNew2:!t.isNew2&&!t.isNew3));
for(const t of ready)$('template').add(new Option(t.name,t.id));
for(const f of Object.keys(themes))$('formation').add(new Option(f,f));
for(const [id,f] of Object.entries(FORMATS))$('format').add(new Option(f.label,id));
$('formation').value='A3P';$('template').value='new3_prism';
let running=false,previewProject=null;
const exporter=new SocialVisualExporter({root:$('studio-export-root'),templates,themes});
function exportAvailability(){
 $('png').disabled=running||exporter.running||!previewProject;
 $('video').disabled=$('png').disabled||!ready.find(t=>t.id===previewProject?.slides[0].templateId)?.motion;
}
// Inspect rendered colors, including inherited styles and mixed colors. Emoji
// artwork and the official logo keep their original pixels.
function paletteErrors(node,theme){
 const errors=[],canvas=document.createElement('canvas');canvas.width=canvas.height=1;
 const ctx=canvas.getContext('2d',{willReadFrequently:true});
 const rgb=color=>{ctx.clearRect(0,0,1,1);ctx.fillStyle=color;ctx.fillRect(0,0,1,1);return [...ctx.getImageData(0,0,1,1).data].map(v=>v/255)};
 const hue=c=>{const max=Math.max(...c.slice(0,3)),min=Math.min(...c.slice(0,3)),d=max-min;if(d<.04)return null;const l=(max+min)/2;if(l<.07||l>.92||d/(1-Math.abs(2*l-1))<.18)return null;return ((max===c[0]?(c[1]-c[2])/d:max===c[1]?(c[2]-c[0])/d+2:(c[0]-c[1])/d+4)*60+360)%360};
 const expected=hue(rgb(theme.primary)),seen=new Set();
 for(const el of [node,...node.querySelectorAll('*')]){
  if(el.closest('.studio-brand-logo')||getComputedStyle(el).display==='none')continue;
  const style=getComputedStyle(el);
  for(const property of ['color','backgroundColor']){
   const value=style[property];if(seen.has(value))continue;seen.add(value);
   const c=rgb(value),h=hue(c);if(c[3]<.2||h===null)continue;
   const delta=Math.abs(h-expected);if(Math.min(delta,360-delta)>25)errors.push('Couleur hors formation : '+value+' ('+el.className+')');
  }
 }
 const luminance=c=>c.slice(0,3).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0);
 for(const action of node.querySelectorAll('.n2-action')){
  const a=luminance(rgb(getComputedStyle(action.querySelector('[data-content-key="cta"]')).color)),b=luminance(rgb(getComputedStyle(action).backgroundColor));
  if((Math.max(a,b)+.05)/(Math.min(a,b)+.05)<4.5)errors.push('Contraste insuffisant du bouton');
 }
 return errors;
}
function illustrationErrors(node){
 const errors=[],main=node.querySelector('main'),frame=main.getBoundingClientRect(),scale=node.getBoundingClientRect().width/node.offsetWidth,tolerance=8*scale;
 const copy=[...main.querySelectorAll('[data-content-key]')].filter(el=>!el.closest('.n3-scene'));
 for(const art of main.querySelectorAll('.n3-art')){
  if(art.parentElement.closest('.n3-art'))continue;
  const r=art.getBoundingClientRect();
  if(r.left<frame.left-tolerance||r.right>frame.right+tolerance||r.top<frame.top-tolerance||r.bottom>frame.bottom+tolerance)errors.push('Illustration hors composition : '+art.className);
  for(const text of copy){
   const t=text.getBoundingClientRect(),width=Math.max(0,Math.min(r.right,t.right)-Math.max(r.left,t.left)),height=Math.max(0,Math.min(r.bottom,t.bottom)-Math.max(r.top,t.top));
   if(width*height>16*scale*scale)errors.push('Illustration sur le texte : '+art.className+' / '+text.dataset.contentKey);
  }
 }
 return errors;
}
async function render(target,id,formation,format,scenario){
 const content=defaultContentForFormation(formation);
 if(scenario==='long')Object.assign(content,{title:'Devenez Agent de Protection Physique des Personnes et préparez votre prochaine étape professionnelle',introduction:'Une formation concrète, une équipe à vos côtés et un accompagnement pour préparer votre avenir professionnel à Puget-sur-Argens.',cta:'Contactez notre équipe pour préparer votre inscription',startDate:'Du 09 novembre 2026 au 19 janvier 2027',location:'Puget-sur-Argens, Côte d’Azur'});
 if(scenario==='legacy')Object.assign(content,{title:'Faites le premier pas vers votre futur métier.',quote:'Faites le premier pas vers votre futur métier',cta:'Faites le premier pas vers votre futur métier'});
 const project=createProject({formation,templateId:id,content});project.format=FORMATS[format];project.slides[0].options.showSafeMargins=false;
 const node=renderSlide(project,project.slides[0],'export',{templates,themes});target.replaceChildren(node);
 if(target===$('preview'))previewProject=project;
 // Layout measurements force a reflow. Batch checks do not need an animation
 // frame for each pass; the export path still waits for painting and decoding.
 if([...node.querySelectorAll('img')].some(image=>!image.complete))await waitForImages(node);
 await fitSlide(node,{waitForPaint:false});await fitSlide(node,{waitForPaint:false});
 await new Promise(resolve=>setTimeout(resolve,0));
 const errors=validateStudioSlide(node).blockingErrors.map(e=>e.message);
 if(id.startsWith('new2_')||id.startsWith('new3_'))errors.push(...paletteErrors(node,themes[formation]));
 if(id.startsWith('new3_'))errors.push(...illustrationErrors(node));
 const text=node.textContent.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const count=(text.match(/faites le premier pas vers votre futur metier/g)||[]).length;
 if(count!==1)errors.push('Signature présente '+count+' fois');
 return {template:id,formation,format,scenario,errors};
}
$('view').onclick=async()=>{const r=await render($('preview'),$('template').value,$('formation').value,$('format').value,$('scenario').value);$('summary').textContent=r.errors.length?r.errors.join(' / '):'Aucune erreur bloquante';exportAvailability();};
async function checkExport(motion){
 if(!previewProject||exporter.running)return;
 const project=JSON.parse(JSON.stringify(previewProject));
 $('png').disabled=$('video').disabled=$('view').disabled=$('run').disabled=true;
 let objectUrl;
 try{
  const args={project,slide:project.slides[0],onStatus:status=>{$('summary').textContent=status}};
  let href,extension='png';
  if(motion){const result=await exporter.exportMotion(args);href=objectUrl=URL.createObjectURL(result.blob);extension=result.extension;}
  else href=await exporter.exportSlide({...args,outputWidth:project.format.width,outputHeight:project.format.height});
  const link=document.createElement('a');link.href=href;link.download=`controle-palette-${project.formation}-${project.slides[0].templateId}.${extension}`;link.click();
  $('summary').textContent='Export '+extension.toUpperCase()+' vérifié : '+project.format.width+' × '+project.format.height;
 }catch(error){$('summary').textContent=error.message;}
 finally{if(objectUrl)setTimeout(()=>URL.revokeObjectURL(objectUrl),1000);$('view').disabled=$('run').disabled=false;exportAvailability();}
}
$('png').onclick=()=>checkExport(false);$('video').onclick=()=>checkExport(true);
$('gallery').onclick=async()=>{
 if(running||exporter.running)return;
 $('gallery').disabled=true;$('preview').replaceChildren();previewProject=null;exportAvailability();$('examples').replaceChildren();$('report').textContent='';
 const page=Number($('sheet').value),selected=selectedTemplates().slice(page*10,page*10+10),results=[];
 try{for(const t of selected){
  const card=document.createElement('div'),label=document.createElement('strong'),cell=document.createElement('div');label.textContent=t.name;cell.className='qa-cell';card.append(label,cell);$('examples').append(card);
  const result=await render(cell,t.id,$('formation').value,'instagram_square',$('scenario').value);card.dataset.errors=JSON.stringify(result.errors);results.push(result);
 }
 $('summary').textContent=selected.length+' modèles affichés · '+results.filter(r=>r.errors.length).length+' erreurs';
 }finally{$('gallery').disabled=false;}
};
$('stop').onclick=()=>{running=false};
$('run').onclick=async()=>{
 const selected=selectedTemplates();
 const formations=$('scope').value==='all'?Object.keys(themes):[$('formation').value],scenario=$('scenario').value;
 running=true;previewProject=null;exportAvailability();$('view').disabled=$('run').disabled=true;$('stop').disabled=false;$('preview').replaceChildren();const results=[];
 try{for(const formation of formations){for(const format of Object.keys(FORMATS)){for(const t of selected){if(!running)break;results.push(await render($('stage'),t.id,formation,format,scenario));$('summary').textContent=results.length+'/'+(selected.length*formations.length*4)+' contrôles';}}}
 const failures=results.filter(r=>r.errors.length);$('report').textContent=JSON.stringify({total:results.length,failed:failures.length,failures},null,2);$('summary').textContent='Terminé : '+(results.length-failures.length)+'/'+results.length+' sans erreur';
 }catch(error){$('report').textContent=error.stack}finally{running=false;$('view').disabled=$('run').disabled=false;$('stop').disabled=true;$('stage').replaceChildren();exportAvailability()}
};
$('summary').textContent=ready.length+' modèles disponibles';await $('view').onclick();
</script></body></html>
