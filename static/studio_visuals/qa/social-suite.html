<!doctype html><html lang="fr"><meta charset="utf-8"><title>Contrôle des 115 modèles sociaux</title>
<link rel="stylesheet" href="/static/studio_visuals/css/studio-shell.css"><link rel="stylesheet" href="/static/studio_visuals/css/studio-canvas.css"><link rel="stylesheet" href="/static/studio_visuals/css/studio-templates.css"><link rel="stylesheet" href="/static/studio_visuals/css/studio-themes.css"><link rel="stylesheet" href="/static/studio_visuals/css/studio-new-templates.css"><link rel="stylesheet" href="/static/studio_visuals/css/studio-new2-templates.css"><link rel="stylesheet" href="/static/studio_visuals/css/studio-new3-templates.css"><link rel="stylesheet" href="/static/studio_visuals/css/studio-metier-templates.css"><link rel="stylesheet" href="/static/studio_visuals/css/studio-bts-templates.css"><link rel="stylesheet" href="/static/studio_visuals/css/studio-seasonal-templates.css"><link rel="stylesheet" href="/static/studio_visuals/css/studio-social-templates.css">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js" defer></script>
<style>body{margin:0;background:#e8ecf4;color:#1b253b;font-family:system-ui}.controls{position:sticky;top:0;z-index:1000;background:white;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.controls select{max-width:280px;padding:8px}.controls button{padding:9px}#preview{zoom:.55;margin:20px}#status,#report{white-space:pre-wrap;font:13px monospace;margin:16px}#audit-stage{position:absolute;left:-20000px;top:0}#sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:16px}.contact-cell{padding:10px;background:white;border-radius:12px}.contact-frame{zoom:.28}.contact-cell p{font-size:12px}.cover-export img{display:block;width:100%;height:auto}.cover-export{min-width:0}#export-preview img{max-width:800px;max-height:700px}#export-preview video{max-height:550px}#caption{max-width:750px;min-height:250px;white-space:pre-wrap}#profile-previews{display:flex;gap:24px;flex-wrap:wrap;padding:16px;align-items:flex-start}.profile-test h3{font-size:14px}.profile-test-card{position:relative;background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden}.profile-test-banner{overflow:hidden}.profile-test-banner img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}.profile-test-avatar{position:absolute;border:4px solid white;border-radius:50%;box-sizing:border-box;background:#dde4eb;display:grid;place-items:center;color:#506071;text-align:center;font:600 12px/1.25 system-ui}.profile-test-name{margin:64px 20px 22px;font-weight:700}#profile-previews:empty{display:none}#slogan-preview{display:flex;gap:16px;flex-wrap:wrap;padding:16px}#slogan-preview:empty{display:none}#slogan-preview h3{font-size:14px}#slogan-preview canvas{display:block;image-rendering:pixelated;max-width:100%;height:auto;border:1px solid #d1d5db}</style>
<body class="social-studio"><div class="controls"><label>Modèle <select id="model"></select></label><label>Format <select id="format"></select></label><label>Diapositive <select id="page"></select></label><button id="slogan">Contrôler le slogan en PNG</button><button id="profile">Aperçu profil LinkedIn</button><button id="covers">Vérifier les couvertures</button><button id="cover-pngs">Exporter les cinq couvertures</button><button id="audit">Vérifier tous les rendus</button><button id="contact">Les cinq modèles</button><button id="slides">Les cinq diapositives</button><button id="png">Tester le PNG</button><button id="video">Tester la vidéo</button><button id="zip">Tester le ZIP</button></div><p id="status">Chargement…</p><div id="slogan-preview"></div><div id="preview"></div><div id="sheet"></div><div id="export-preview"></div><div id="profile-previews"></div><label>Réseau social <select id="network"><option value="facebook">Facebook</option><option value="instagram">Instagram</option><option value="linkedin">LinkedIn</option></select></label><textarea id="caption" aria-label="Texte de publication"></textarea><pre id="report"></pre><div id="audit-stage"></div><div id="studio-export-root"></div>
<script type="module">
import {LINKEDIN_PROFILE_FRAMES,validateLinkedInProfilePreview} from '/static/studio_visuals/js/studio-linkedin-preview.js';
import {renderSlide} from '/static/studio_visuals/js/studio-renderer.js';
import {fitSlide} from '/static/studio_visuals/js/studio-text-fit.js';
import {validateStudioSlide} from '/static/studio_visuals/js/studio-validation.js';
import {SocialVisualExporter,waitForImages} from '/static/studio_visuals/js/studio-exporter.js';
import {startStudioMotion} from '/static/studio_visuals/js/studio-motion.js';
import {createProject,ALL_FORMATS} from '/static/studio_visuals/js/studio-store.js';
import {applySocialTemplate,publicationText,createCarouselZip} from '/static/studio_visuals/js/studio-social-tools.js';
const $=id=>document.getElementById(id);
const [{templates},themes]=await Promise.all(['templates','themes'].map(n=>fetch(`/static/studio_visuals/data/${n}.json`).then(r=>r.json())));
const models=templates.filter(t=>t.isSocialSuite),exporter=new SocialVisualExporter({root:$('studio-export-root'),themes,templates});
for(const t of models)$('model').add(new Option(t.name,t.id));let current,motion,request=0;
function controls(){const t=models.find(t=>t.id===$('model').value),old=$('format').value;$('format').replaceChildren();for(const id of t.supportedFormats)$('format').add(new Option(ALL_FORMATS[id].label,id));if(t.supportedFormats.includes(old))$('format').value=old;$('page').replaceChildren();for(let i=0;i<(t.slideCount||1);i++)$('page').add(new Option(String(i+1),String(i)));}
function sloganMaskErrors(root){const errors=[];for(let el=root.querySelector('.sv-brand__slogan');el&&el!==root;el=el.parentElement){const s=getComputedStyle(el);if([s.overflowX,s.overflowY].some(v=>['hidden','clip'].includes(v))&&[s.borderTopLeftRadius,s.borderTopRightRadius,s.borderBottomLeftRadius,s.borderBottomRightRadius].some(v=>parseFloat(v)>0))errors.push('Un masque arrondi peut couper le slogan : '+el.className)}return errors}
async function render(target,t,format,page=0,logoWidth){const project=createProject({formation:t.formationPreset});applySocialTemplate(project,t);project.format=ALL_FORMATS[format];project.activeSlideIndex=page;const slide=project.slides[page];if(logoWidth)slide.logo.width=logoWidth;slide.options.showSafeMargins=false;const node=renderSlide(project,slide,'export',{templates,themes});target.replaceChildren(node);await waitForImages(node);await fitSlide(node,{waitForPaint:false});await fitSlide(node,{waitForPaint:false});const v=validateStudioSlide(node);const img=node.querySelector('.studio-brand-footer__logo'),zoom=node.getBoundingClientRect().width/project.format.width;const logo={width:Math.round(img.getBoundingClientRect().width/zoom),height:Math.round(img.getBoundingClientRect().height/zoom)};return {node,project,slide,logo,errors:[...v.blockingErrors.map(e=>e.message),...sloganMaskErrors(node),...(t.network==='linkedin'?validateLinkedInProfilePreview(node,project.format):[])],scale:node.querySelector('main')?.dataset.layoutScale||'1'};}
async function preview(){const revision=++request;current=null;motion?.stop();$('sheet').replaceChildren();const t=models.find(t=>t.id===$('model').value),r=await render($('preview'),t,$('format').value,Number($('page').value));if(revision!==request||!r.node.isConnected)return;current=r;motion=startStudioMotion(r.node);$('caption').value=publicationText(r.project,t,$('network').value);$('status').textContent=r.errors.length?JSON.stringify(r.errors):`${t.name} · diapositive ${Number($('page').value)+1} · vérifié`;}
$('slogan').onclick=async()=>{if(!current)return;try{motion?.stop();$('slogan-preview').replaceChildren();const {node,project,slide}=current,box=node.getBoundingClientRect(),slogan=node.querySelector('.sv-brand__slogan'),r=slogan.getBoundingClientRect(),scale=box.width/project.format.width;const x=Math.max(0,Math.floor((r.left-box.left)/scale)-8),y=Math.max(0,Math.floor((r.top-box.top)/scale)-6),w=Math.min(160,project.format.width-x),h=Math.ceil(r.height/scale)+12;for(const factor of [1,2]){const data=await exporter.exportSlide({project,slide,outputWidth:project.format.width*factor,outputHeight:project.format.height*factor,onStatus:s=>$('status').textContent=s});const img=new Image();img.src=data;await img.decode();const section=document.createElement('section'),label=document.createElement('h3'),canvas=document.createElement('canvas');label.textContent=`Début du slogan · PNG ${factor===1?'standard':'HD ×2'} · agrandissement`;canvas.width=w*factor;canvas.height=h*factor;canvas.style.width=w*4+'px';canvas.getContext('2d').drawImage(img,x*factor,y*factor,w*factor,h*factor,0,0,w*factor,h*factor);section.append(label,canvas);$('slogan-preview').append(section)}const errors=sloganMaskErrors(node);$('status').textContent=errors.length?errors.join('\n'):'PNG standard et HD : aucun masque arrondi sur le slogan';}catch(e){$('status').textContent=e.stack}};
$('profile').onclick=async()=>{if(!current||current.project.format.id!=='linkedin_cover'){$('status').textContent='Sélectionnez une couverture LinkedIn.';return}try{motion?.stop();const data=await exporter.exportSlide({...current,outputWidth:1584,outputHeight:396,onStatus:s=>$('status').textContent=s});$('profile-previews').replaceChildren();for(const frame of LINKEDIN_PROFILE_FRAMES){const section=document.createElement('section');section.className='profile-test';const label=document.createElement('h3');label.textContent=frame.label;const card=document.createElement('div');card.className='profile-test-card';card.style.width=frame.width+'px';const banner=document.createElement('div');banner.className='profile-test-banner';banner.style.height=frame.height+'px';const img=new Image();img.src=data;img.alt='Couverture LinkedIn exportée';banner.append(img);const avatar=document.createElement('div');avatar.className='profile-test-avatar';Object.assign(avatar.style,{left:frame.avatar.left+'px',top:frame.avatar.top+'px',width:frame.avatar.size+'px',height:frame.avatar.size+'px'});avatar.innerHTML='<span>Photo<br>de profil</span>';const name=document.createElement('p');name.textContent='Votre profil LinkedIn';name.className='profile-test-name';card.append(banner,avatar,name);section.append(label,card);$('profile-previews').append(section)}$('status').textContent='PNG 1584 × 396 · trois simulations de profil prêtes';}catch(e){$('status').textContent=e.stack}};
$('network').onchange=()=>{if(current)$('caption').value=publicationText(current.project,models.find(t=>t.id===$('model').value),$('network').value)};
$('covers').onclick=async()=>{motion?.stop();$('covers').disabled=true;const rows=[];try{for(const t of models.filter(m=>m.isCover))for(const size of [150,200,220,250,320]){const r=await render($('audit-stage'),t,t.supportedFormats[0],0,size);const expected=Math.min(size,t.network==='facebook'?180:250);const errors=[...r.errors];if(r.logo.width!==expected||r.logo.height!==expected)errors.push('Dimensions réelles du logo incorrectes');if(r.node.textContent.split('Faites le premier pas vers votre futur métier').length!==2)errors.push('Slogan absent ou dupliqué');rows.push({id:t.id,size,logo:r.logo,errors,scale:r.scale})}const failures=rows.filter(r=>r.errors.length);$('report').textContent=JSON.stringify({total:rows.length,failed:failures.length,scaled:rows.filter(r=>Number(r.scale)<.99),rows},null,2);$('status').textContent=`Couvertures : ${rows.length-failures.length}/${rows.length} rendus valides`;}catch(e){$('report').textContent=e.stack}finally{$('covers').disabled=false;$('audit-stage').replaceChildren()}};
$('model').onchange=()=>{controls();preview()};$('format').onchange=preview;$('page').onchange=preview;
$('audit').onclick=async()=>{motion?.stop();$('audit').disabled=true;const rows=[];try{for(const t of models)for(const format of t.supportedFormats)for(let page=0;page<(t.slideCount||1);page++){const r=await render($('audit-stage'),t,format,page);rows.push({id:t.id,format,page,errors:r.errors,scale:r.scale});$('status').textContent=`${rows.length} rendus contrôlés`;}const failures=rows.filter(x=>x.errors.length);$('report').textContent=JSON.stringify({total:rows.length,failed:failures.length,scaled:rows.filter(r=>Number(r.scale)<.99),failures},null,2);$('status').textContent=`Terminé : ${rows.length-failures.length}/${rows.length} rendus valides`;}catch(e){$('report').textContent=e.stack}finally{$('audit').disabled=false;$('audit-stage').replaceChildren()}};
async function sheet(slides=false){motion?.stop();$('sheet').replaceChildren();const t=models.find(t=>t.id===$('model').value),list=slides?Array.from({length:t.slideCount||1},(_,page)=>({t,page})):models.filter(m=>m.courseKey===t.courseKey&&m.isCarousel===t.isCarousel&&m.isCover===t.isCover&&m.sessionKind===t.sessionKind&&m.network===t.network).map(t=>({t,page:0}));for(const item of list){const cell=document.createElement('div');cell.className='contact-cell';const frame=document.createElement('div');frame.className='contact-frame';cell.append(frame);const label=document.createElement('p');label.textContent=slides?`Diapositive ${item.page+1}`:item.t.name;cell.append(label);$('sheet').append(cell);await render(frame,item.t,$('format').value,item.page)}$('status').textContent='Planche prête';}
$('contact').onclick=()=>sheet();$('slides').onclick=()=>sheet(true);
$('cover-pngs').onclick=async()=>{const selected=models.find(t=>t.id===$('model').value);if(!selected.isCover){$('status').textContent='Sélectionnez une couverture.';return}motion?.stop();$('cover-pngs').disabled=true;$('sheet').replaceChildren();const rows=[];try{for(const t of models.filter(m=>m.isCover&&m.network===selected.network)){const r=await render($('audit-stage'),t,t.supportedFormats[0]);if(r.errors.length)throw new Error(t.name+' : '+r.errors.join('; '));const cell=document.createElement('section');cell.className='contact-cell cover-export';const title=document.createElement('p');title.textContent=t.name;cell.append(title);$('sheet').append(cell);for(const factor of [1,2]){const data=await exporter.exportSlide({...r,outputWidth:r.project.format.width*factor,outputHeight:r.project.format.height*factor,onStatus:s=>$('status').textContent=t.name+' · '+s});const image=new Image();image.src=data;image.alt=t.name+(factor===1?' · PNG standard':' · PNG HD');await image.decode();rows.push({id:t.id,factor,width:image.naturalWidth,height:image.naturalHeight});if(factor===2)cell.append(image)}}$('report').textContent=JSON.stringify({total:rows.length,rows},null,2);$('status').textContent='Cinq couvertures : 10 exports PNG standard et HD vérifiés';}catch(e){$('status').textContent=e.stack}finally{$('cover-pngs').disabled=false;$('audit-stage').replaceChildren()}};
$('png').onclick=async()=>{if(!current)return;try{motion?.stop();const {project,slide}=current,data=await exporter.exportSlide({project,slide,outputWidth:project.format.width,outputHeight:project.format.height,onStatus:s=>$('status').textContent=s});const image=new Image();image.src=data;await image.decode();$('export-preview').replaceChildren(image);$('status').textContent=`PNG vérifié : ${image.naturalWidth} × ${image.naturalHeight}`;}catch(e){$('status').textContent=e.stack}};
$('video').onclick=async()=>{if(!current)return;try{motion?.stop();const result=await exporter.exportMotion({...current,onStatus:s=>$('status').textContent=s});const video=document.createElement('video');video.controls=true;video.src=URL.createObjectURL(result.blob);$('export-preview').replaceChildren(video);$('status').textContent=`Vidéo vérifiée : ${result.width} × ${result.height} · ${result.blob.size} octets`;}catch(e){$('status').textContent=e.stack}};
$('zip').onclick=async()=>{if(!current)return;const files=[];try{motion?.stop();const project=current.project;for(const [i,slide] of project.slides.entries()){const data=await exporter.exportSlide({project,slide,outputWidth:project.format.width,outputHeight:project.format.height,onStatus:s=>$('status').textContent=`Image ${i+1} : ${s}`});files.push({name:`${i+1}.png`,bytes:Uint8Array.from(atob(data.split(',')[1]),c=>c.charCodeAt(0))})}files.push({name:'texte-publication.txt',bytes:new TextEncoder().encode($('caption').value)});const blob=createCarouselZip(files),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='carrousel-verifie.zip';a.textContent='Télécharger le carrousel vérifié';$('export-preview').replaceChildren(a);$('status').textContent=`ZIP vérifié : ${project.slides.length} PNG + texte · ${blob.size} octets`;}catch(e){$('status').textContent=e.stack}};
controls();await preview();
</script></body></html>
